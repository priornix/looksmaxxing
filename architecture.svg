<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800"
     role="img" aria-label="Architecture of the claim ledger pipeline: agents mine and triage claims, retrieve evidence from Europe PMC and openFDA, and only a three-stage verification path may write a row into the claim graph; the composer renders from that graph and a deterministic coverage lint either passes to publish, bounces the draft back, or halts the run."
     style="color:#1E2530; max-width:100%; height:auto; font-family:ui-sans-serif,-apple-system,'IBM Plex Sans',Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F5AA8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B3402C"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F6F5C"/>
    </marker>
  </defs>

  <!-- ===== L3 control plane ===== -->
  <rect x="40" y="28" width="1100" height="58" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4" opacity=".55"/>
  <text x="56" y="50" font-size="10.5" letter-spacing="1.6" fill="currentColor" opacity=".6">L3  CONTROL</text>
  <text x="56" y="72" font-size="12.5" fill="currentColor">model router (deterministic ▸ cheap ▸ frontier)   ·   evals on gold set   ·   immutable audit log   ·   DSPy prompt optimisation</text>

  <!-- ===== L2 agent chain ===== -->
  <text x="56" y="118" font-size="10.5" letter-spacing="1.6" fill="currentColor" opacity=".6">L2  AGENTS</text>

  <g stroke-width="1.4" fill="none">
    <rect x="55"  y="130" width="150" height="64" rx="4" stroke="currentColor"/>
    <rect x="227" y="130" width="150" height="64" rx="4" stroke="currentColor"/>
    <rect x="399" y="130" width="150" height="64" rx="4" stroke="currentColor"/>
    <rect x="571" y="130" width="150" height="64" rx="4" stroke="#2F5AA8" fill="#2F5AA8" fill-opacity=".07"/>
    <rect x="743" y="130" width="150" height="64" rx="4" stroke="#2F5AA8" fill="#2F5AA8" fill-opacity=".07"/>
    <rect x="915" y="130" width="150" height="64" rx="4" stroke="currentColor"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="currentColor">
    <text x="130" y="158">Scout</text><text x="130" y="176" font-size="10.5" opacity=".62">cron · topic gaps</text>
    <text x="302" y="158">Claim Miner</text><text x="302" y="176" font-size="10.5" opacity=".62">→ atomic claims</text>
    <text x="474" y="158">Triage</text><text x="474" y="176" font-size="10.5" opacity=".62">risk tier</text>
    <text x="646" y="158" fill="#2F5AA8">Evidence</text><text x="646" y="176" font-size="10.5" fill="#2F5AA8" opacity=".8">stage A · resolves?</text>
    <text x="818" y="158" fill="#2F5AA8">Relevance Gate</text><text x="818" y="176" font-size="10.5" fill="#2F5AA8" opacity=".8">stage A2 · anchors</text>
    <text x="990" y="158">Entailment Judge</text><text x="990" y="176" font-size="10.5" opacity=".62">stage B · supports?</text>
  </g>

  <g stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" fill="none">
    <line x1="205" y1="162" x2="223" y2="162"/>
    <line x1="377" y1="162" x2="395" y2="162"/>
    <line x1="549" y1="162" x2="567" y2="162"/>
    <line x1="721" y1="162" x2="739" y2="162"/>
    <line x1="893" y1="162" x2="911" y2="162"/>
  </g>
  <text x="830" y="124" font-size="10.5" text-anchor="middle" fill="#2F5AA8">6 of 8 dropped</text>

  <!-- tripwire floor -->
  <rect x="399" y="216" width="150" height="42" rx="4" fill="#2F5AA8" fill-opacity=".07" stroke="#2F5AA8" stroke-width="1.4"/>
  <text x="474" y="233" font-size="11.5" text-anchor="middle" fill="#2F5AA8">tripwire floor</text>
  <text x="474" y="249" font-size="10" text-anchor="middle" fill="#2F5AA8" opacity=".8">regex · versioned</text>
  <line x1="474" y1="216" x2="474" y2="198" stroke="#2F5AA8" stroke-width="1.4" marker-end="url(#ab)"/>
  <text x="486" y="211" font-size="10.5" fill="#2F5AA8">raises only — never lowers</text>

  <!-- ===== L0 evidence ===== -->
  <rect x="571" y="292" width="489" height="66" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4" opacity=".55"/>
  <text x="587" y="312" font-size="10.5" letter-spacing="1.6" fill="currentColor" opacity=".6">L0  EVIDENCE · keyless · live</text>
  <g font-size="11.5" fill="currentColor">
    <text x="587" y="336">Europe PMC</text><text x="587" y="350" font-size="9.5" opacity=".62">full text (OA)</text>
    <text x="740" y="336">openFDA</text><text x="740" y="350" font-size="9.5" opacity=".62">labels + FAERS</text>
    <text x="880" y="336">PubMed</text><text x="880" y="350" font-size="9.5" opacity=".62">fallback index</text>
  </g>
  <text x="1046" y="336" font-size="10" text-anchor="end" fill="currentColor" opacity=".62">pub_type + design markers</text>
  <text x="1046" y="350" font-size="10" text-anchor="end" fill="currentColor" opacity=".62">──▸ evidence_tier  [mapping]</text>

  <line x1="646" y1="194" x2="646" y2="288" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="656" y="245" font-size="10.5" fill="currentColor">query</text>
  <line x1="990" y1="292" x2="990" y2="198" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="1000" y="245" font-size="10.5" fill="currentColor">fulltext | abstract</text>
  <text x="1000" y="259" font-size="9.5" fill="currentColor" opacity=".62">substrate recorded</text>

  <!-- ===== L1 claim graph ===== -->
  <rect x="260" y="398" width="820" height="112" rx="4" fill="currentColor" fill-opacity=".035" stroke="currentColor" stroke-width="1.6"/>
  <text x="278" y="420" font-size="10.5" letter-spacing="1.6" fill="currentColor" opacity=".6">L1  CLAIM GRAPH · system of record</text>
  <text x="278" y="444" font-size="11" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" fill="currentColor">Claim{ id, canonical_text, entities, evidence_tier, risk_tier,</text>
  <text x="278" y="461" font-size="11" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" fill="currentColor">       verdict, harm_note, sources[], verified_against }</text>
  <text x="278" y="486" font-size="10.5" fill="currentColor" opacity=".7">edges: supports · refutes · supersedes · duplicate-of</text>

  <circle cx="880" cy="454" r="5" fill="currentColor"/>
  <text x="880" y="434" font-size="9.5" text-anchor="middle" fill="currentColor" opacity=".7">one node</text>
  <g stroke="currentColor" stroke-width="1.1" opacity=".7">
    <line x1="885" y1="450" x2="975" y2="428"/><line x1="885" y1="454" x2="975" y2="454"/><line x1="885" y1="458" x2="975" y2="480"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.1" opacity=".7">
    <rect x="977" y="418" width="76" height="20" rx="3"/><rect x="977" y="444" width="76" height="20" rx="3"/><rect x="977" y="470" width="76" height="20" rx="3"/>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="currentColor" opacity=".8">
    <text x="1015" y="432">page</text><text x="1015" y="458">page</text><text x="1015" y="484">page</text>
  </g>
  <text x="1015" y="504" font-size="9.5" text-anchor="middle" fill="currentColor" opacity=".62">many pages</text>

  <path d="M1065,162 L1112,162 L1112,454 L1084,454" fill="none" stroke="currentColor" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="1104" y="384" font-size="10.5" text-anchor="end" fill="currentColor">only write path</text>

  <!-- ===== composer / gate / publish ===== -->
  <rect x="260" y="558" width="150" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <rect x="460" y="558" width="200" height="64" rx="4" fill="#2F5AA8" fill-opacity=".07" stroke="#2F5AA8" stroke-width="2"/>
  <rect x="710" y="558" width="150" height="64" rx="4" fill="none" stroke="#1F6F5C" stroke-width="1.4"/>
  <g font-size="12.5" text-anchor="middle">
    <text x="335" y="586" fill="currentColor">Composer</text>
    <text x="335" y="604" font-size="10.5" fill="currentColor" opacity=".62">cannot add facts</text>
    <text x="560" y="582" fill="#2F5AA8">Coverage Lint</text>
    <text x="560" y="598" font-size="10" fill="#2F5AA8" opacity=".85">deterministic · blocking</text>
    <text x="560" y="612" font-size="10" fill="#2F5AA8" opacity=".85">fail-closed</text>
    <text x="785" y="586" fill="#1F6F5C">Publish</text>
    <text x="785" y="604" font-size="10.5" fill="#1F6F5C" opacity=".8">JSON-LD ClaimReview</text>
  </g>

  <line x1="335" y1="510" x2="335" y2="554" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="345" y="536" font-size="10.5" fill="currentColor">renders rows only</text>
  <line x1="410" y1="590" x2="456" y2="590" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="433" y="581" font-size="10" text-anchor="middle" fill="currentColor">draft</text>
  <line x1="660" y1="590" x2="706" y2="590" stroke="#1F6F5C" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="683" y="581" font-size="10" text-anchor="middle" fill="#1F6F5C">PASS</text>

  <path d="M500,622 L500,664 L335,664 L335,626" fill="none" stroke="#B3402C" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="418" y="680" font-size="10.5" text-anchor="middle" fill="#B3402C">findings → redraft   (unbacked_absolute · uncited_assertion)</text>

  <line x1="620" y1="622" x2="620" y2="694" stroke="#B3402C" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="540" y="696" width="220" height="42" rx="4" fill="#B3402C" fill-opacity=".07" stroke="#B3402C" stroke-width="1.4"/>
  <text x="650" y="713" font-size="11.5" text-anchor="middle" fill="#B3402C">HALT · blocked: true</text>
  <text x="650" y="729" font-size="9.5" text-anchor="middle" fill="#B3402C" opacity=".85">drafts exhausted — nothing published</text>

  <!-- watcher -->
  <rect x="900" y="558" width="180" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="990" y="582" font-size="12.5" text-anchor="middle" fill="currentColor">Watcher</text>
  <text x="990" y="600" font-size="10.5" text-anchor="middle" fill="currentColor" opacity=".62">cron · Hermes profile</text>
  <text x="990" y="614" font-size="10.5" text-anchor="middle" fill="currentColor" opacity=".62">never touches the gate</text>
  <path d="M990,558 L990,514" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="1000" y="540" font-size="10.5" fill="currentColor">re-entail changed nodes</text>

  <!-- legend -->
  <g font-size="10.5" fill="currentColor">
    <rect x="56" y="700" width="22" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <text x="86" y="710" opacity=".75">LLM step</text>
    <rect x="160" y="700" width="22" height="12" rx="2" fill="#2F5AA8" fill-opacity=".12" stroke="#2F5AA8" stroke-width="1.4"/>
    <text x="190" y="710" fill="#2F5AA8">deterministic — no model</text>
    <line x1="360" y1="706" x2="392" y2="706" stroke="#B3402C" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="400" y="710" fill="#B3402C">rejection path</text>
  </g>
  <text x="56" y="738" font-size="10.5" fill="currentColor" opacity=".62">Stage A resolves the identifier · A2 checks the claim's anchor entities appear in the source · B judges support. A citation existing is not a citation supporting.</text>
  <text x="56" y="756" font-size="10.5" fill="currentColor" opacity=".62">Publish is reachable only through a passing lint. Article 400 reuses claims verified for articles 1–399, so verification cost amortises.</text>
</svg>
